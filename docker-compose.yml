# docker-compose.yml
services:
  redis:
    image: redis:8.8.2
    pull_policy: never
    container_name: next-social-v3-ai-chat-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    container_name: next-social-v3-ai-chat-minio
    ports:
      - "9000:9000" # API（S3）
      - "9001:9001" # Web 控制台
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      # test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 可选：容器启动后自动创建 bucket（演示更省事）
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    pull_policy: never
    container_name: next-social-v3-ai-chat-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c " sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin; mc mb -p local/next-social-v3-ai-chat-uploads || true; mc anonymous set download local/next-social-v3-ai-chat-uploads || true; exit 0; "

volumes:
  redis_data:
  minio_data:
